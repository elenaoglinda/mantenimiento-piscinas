name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders; the Phase 0 landing page does not call Supabase.
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  ui:
    name: ui checks (axe, keyboard, overflow, end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Against the harness's fake Supabase backend (scripts/redesign): no secrets needed.
      - run: npx playwright test -c scripts/redesign/playwright.config.ts a11y overflow keyboard flow history
        env:
          SHOT_DIR: ci
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-checks
          path: |
            docs/redesign/ci/
            test-results/

  sql:
    name: database lifecycle
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply every migration in order
        run: |
          psql -d postgres -c 'create database app'
          psql -v ON_ERROR_STOP=1 -q -d app -f supabase/tests/_local_supabase_stubs.sql
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "applying $(basename "$f")"
            psql -v ON_ERROR_STOP=1 -q -d app -f "$f"
          done
      - name: Fiscal state-machine tests
        run: psql -v ON_ERROR_STOP=1 -d app -f supabase/tests/invoicing_lifecycle.test.sql
      - name: Privilege guard tests (members can't promote themselves)
        run: psql -v ON_ERROR_STOP=1 -d app -f supabase/tests/app_user_privileges.test.sql
      - name: Rollback must refuse while issued invoices exist
        run: |
          if psql -v ON_ERROR_STOP=1 -q -d app \
               -f supabase/rollback/20261002120000_invoicing_lifecycle.down.sql 2>/dev/null; then
            echo "::error::rollback succeeded despite issued invoices"; exit 1
          fi
          echo "rollback correctly refused"
