name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Build every /api function with Vercel's builder and load it: catches functions that
      # compile but crash on Vercel (and checks the 250 MB size limit).
      - name: /api functions build and load like on Vercel
        run: node scripts/check-api.cjs

  e2e:
    runs-on: ubuntu-latest
    env:
      # Build-time placeholders; the Phase 0 landing page does not call Supabase.
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  ui:
    name: ui checks (axe, keyboard, overflow, end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Against the harness's fake Supabase backend (scripts/redesign): no secrets needed.
      - run: npx playwright test -c scripts/redesign/playwright.config.ts a11y overflow keyboard flow history service-log client-reports
        env:
          SHOT_DIR: ci
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-checks
          path: |
            docs/redesign/ci/
            test-results/

  sql:
    name: database lifecycle
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply every migration in order
        run: |
          psql -d postgres -c 'create database app'
          psql -v ON_ERROR_STOP=1 -q -d app -f supabase/tests/_local_supabase_stubs.sql
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "applying $(basename "$f")"
            psql -v ON_ERROR_STOP=1 -q -d app -f "$f"
          done
      - name: Fiscal state-machine tests
        run: psql -v ON_ERROR_STOP=1 -d app -f supabase/tests/invoicing_lifecycle.test.sql
      - name: Rollback must refuse while issued invoices exist
        run: |
          if psql -v ON_ERROR_STOP=1 -q -d app \
               -f supabase/rollback/20261002120000_invoicing_lifecycle.down.sql 2>/dev/null; then
            echo "::error::rollback succeeded despite issued invoices"; exit 1
          fi
          echo "rollback correctly refused"
      - name: Service-log tests (other orgs locked out, signed reports immutable)
        run: psql -v ON_ERROR_STOP=1 -d app -f supabase/tests/service_log.test.sql
      - name: Service-log migrations roll back and re-apply cleanly
        run: |
          for f in route_stop_status parameters_outside_siloe visit_tasks chemical_products; do
            psql -v ON_ERROR_STOP=1 -q -d app -f supabase/rollback/$(ls supabase/rollback | grep "_$f.down.sql")
          done
          for f in $(ls supabase/migrations/202611031300*.sql supabase/migrations/202611031301*.sql \
                        supabase/migrations/202611031302*.sql supabase/migrations/202611031303*.sql); do
            psql -v ON_ERROR_STOP=1 -q -d app -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -tA -d app -c \
            "select count(*) from public.parameter_def where not in_siloe" | grep -qx 4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Local seed (supabase/seed.sql) loads on an empty database, and only there
        run: |
          psql -d postgres -c 'create database seedcheck'
          # Roles are server-wide and already exist from the first database; the rest is per database.
          grep -v '^create role' supabase/tests/_local_supabase_stubs.sql | psql -v ON_ERROR_STOP=1 -q -d seedcheck
          for f in $(ls supabase/migrations/*.sql | sort); do
            psql -v ON_ERROR_STOP=1 -q -d seedcheck -f "$f"
          done
          psql -v ON_ERROR_STOP=1 -q -d seedcheck -f supabase/seed.sql
          psql -v ON_ERROR_STOP=1 -tA -d seedcheck -c \
            "select count(*) > 20 from public.report where org_id = 'd0000000-0000-4000-8000-000000000002'" | grep -qx t
          # A second run must change nothing.
          before=$(psql -tA -d seedcheck -c 'select count(*) from public.report')
          psql -v ON_ERROR_STOP=1 -q -d seedcheck -f supabase/seed.sql
          [ "$(psql -tA -d seedcheck -c 'select count(*) from public.report')" = "$before" ]
      - name: Demo seed data satisfies the schema; reset touches only the demo org
        run: bash scripts/demo/ci-check.sh
